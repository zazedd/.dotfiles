name: "check systems"
on:
  pull_request:
  push:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [lenovo, server]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: eval
        run: nix eval .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
      - name: build
        id: build
        run: |
          echo "path=$(nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
      - name: connect to tailnet
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: xinho
      - name: push to Attic
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          cache_ip="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "xinho") | .TailscaleIPs[] | select(contains("."))' | head -n1)"
          test -n "$cache_ip"
          echo "$cache_ip cache.leoms.dev" | sudo tee -a /etc/hosts
          nix run nixpkgs#attic-client -- login home https://cache.leoms.dev "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push dotfiles "${{ steps.build.outputs.path }}"

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: eval
        run: nix eval .#darwinConfigurations.shitbook.system
      - name: build
        id: build
        run: |
          echo "path=$(nix build .#darwinConfigurations.shitbook.system --no-link --print-out-paths)" >> "$GITHUB_OUTPUT"
      - name: connect to tailnet
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: xinho
      - name: push to Attic
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          cache_ip="$(tailscale status --json | jq -r '.Peer[] | select(.HostName == "xinho") | .TailscaleIPs[] | select(contains("."))' | head -n1)"
          test -n "$cache_ip"
          echo "$cache_ip cache.leoms.dev" | sudo tee -a /etc/hosts
          nix run nixpkgs#attic-client -- login home https://cache.leoms.dev "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push dotfiles "${{ steps.build.outputs.path }}"
