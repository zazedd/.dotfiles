name: "check systems"
on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: check formatting
        run: nix fmt -- --ci
      - name: lint Nix
        run: |
          nix run nixpkgs#statix -- check .
          nix run nixpkgs#deadnix -- --fail --no-lambda-pattern-names .
      - name: check flake
        run: nix flake check

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [lenovo, server]
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: connect to tailnet
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ricardogoncalves
      - name: resolve Attic over Tailscale
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        run: |
          cache_ip="$(tailscale status | awk '$2 == "ricardogoncalves" { print $1; exit }')"
          test -n "$cache_ip"
          echo "$cache_ip cache.leoms.dev" | sudo tee -a /etc/hosts
      - name: build
        id: build
        run: |
          cache_args=()
          if [[ "${{ github.event_name }}" == "push" && "${{ vars.ATTIC_ENABLED }}" == "true" ]]; then
            cache_args+=(
              --extra-substituters https://cache.leoms.dev/dotfiles
              --extra-trusted-public-keys dotfiles:L8eOKFwsyzXtQShyNzr9HpLA2T2owJFE9XbzMyb3Rn0=
            )
          fi
          path="$(nix build "${cache_args[@]}" .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel --no-link --print-out-paths)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: push to Attic
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run nixpkgs#attic-client -- login home https://cache.leoms.dev "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push dotfiles "${{ steps.build.outputs.path }}"

  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes pipe-operators"
      - name: connect to tailnet
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ricardogoncalves
      - name: resolve Attic over Tailscale
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        run: |
          cache_ip="$(tailscale status | awk '$2 == "ricardogoncalves" { print $1; exit }')"
          test -n "$cache_ip"
          echo "$cache_ip cache.leoms.dev" | sudo tee -a /etc/hosts
      - name: build
        id: build
        run: |
          cache_args=()
          if [[ "${{ github.event_name }}" == "push" && "${{ vars.ATTIC_ENABLED }}" == "true" ]]; then
            cache_args+=(
              --extra-substituters https://cache.leoms.dev/dotfiles
              --extra-trusted-public-keys dotfiles:L8eOKFwsyzXtQShyNzr9HpLA2T2owJFE9XbzMyb3Rn0=
            )
          fi
          path="$(nix build "${cache_args[@]}" .#darwinConfigurations.shitbook.system --no-link --print-out-paths)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: push to Attic
        if: github.event_name == 'push' && vars.ATTIC_ENABLED == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          nix run nixpkgs#attic-client -- login home https://cache.leoms.dev "$ATTIC_TOKEN"
          nix run nixpkgs#attic-client -- push dotfiles "${{ steps.build.outputs.path }}"
